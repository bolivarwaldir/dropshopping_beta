<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar compra | Los Chingones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .checkout-container { max-width: 1100px; margin: 40px auto; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 48px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.95rem; }
    .form-group input, .form-group select { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 1rem; background: #fff; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #111; }
    .payment-options { display: grid; gap: 12px; }
    .payment-option { border: 2px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
    .payment-option:hover { border-color: #111; }
    .payment-option.selected { border-color: #111; background: #fafafa; }
    .payment-option input { margin: 0; }
    .summary-box { background: #fafafa; border-radius: 16px; padding: 24px; }
    .summary-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 0.95rem; }
    .pse-info { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 10px; padding: 14px; margin-top: 12px; font-size: 0.9rem; color: #0369a1; display: none; }
    @media (max-width: 800px) { .checkout-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo"><img src="imagine_images/2zyoy.jpg" alt="Los Chingones"></a>
      <a href="carrito.html">← Volver al carrito</a>
    </div>
  </header>

  <section class="section">
    <h2 class="section-title">Finalizar compra</h2>
    <div class="checkout-container">
      <form onsubmit="placeOrder(event)" id="checkout-form">
        <h3 style="margin-bottom: 20px;">Datos de envío</h3>
        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" required placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" required placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="form-group">
          <label>Teléfono / WhatsApp</label>
          <input type="tel" required placeholder="300 123 4567">
        </div>
        <div class="form-group">
          <label>Dirección de envío</label>
          <input type="text" required placeholder="Calle, número, barrio, ciudad">
        </div>
        <div class="form-group">
          <label>Ciudad</label>
          <input type="text" required placeholder="Bogotá, Medellín, etc.">
        </div>

        <h3 style="margin: 32px 0 16px;">Método de pago</h3>
        <div class="payment-options">
          <label class="payment-option selected">
            <input type="radio" name="payment" value="pse" checked onchange="togglePSE()">
            <div>
              <strong>PSE</strong>
              <div style="font-size:0.85rem; color:#666;">Pago seguro desde tu banco</div>
            </div>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="tarjeta" onchange="togglePSE()">
            <div>
              <strong>Tarjeta de crédito / débito</strong>
              <div style="font-size:0.85rem; color:#666;">Visa, Mastercard, American Express</div>
            </div>
          </label>
          <label class="payment-option">
            <input type="radio" name="payment" value="contraentrega" onchange="togglePSE()">
            <div>
              <strong>Pago contra entrega</strong>
              <div style="font-size:0.85rem; color:#666;">Paga cuando recibas tu pedido</div>
            </div>
          </label>
        </div>

        <div class="pse-info" id="pse-info">
          <strong>Pago por PSE:</strong> Al confirmar serás redirigido a la plataforma de tu banco para completar el pago de forma segura. El pedido se procesará una vez confirmado el pago.
        </div>

        <button type="submit" class="btn" style="width: 100%; margin-top: 28px; padding: 16px; font-size: 1.05rem;">
          Confirmar pedido
        </button>
      </form>

      <div class="summary-box">
        <h3 style="margin-bottom: 16px;">Resumen del pedido</h3>
        <div id="order-summary"></div>
        <div id="order-total" style="font-size:1.35rem; font-weight:700; margin-top:20px; text-align:right; padding-top:12px; border-top:2px solid #ddd;"></div>
        <p style="font-size:0.85rem; color:#666; margin-top:16px; text-align:center;">Envío estimado: 3-7 días hábiles</p>
      </div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function togglePSE() {
      const selected = document.querySelector('input[name="payment"]:checked').value;
      document.querySelectorAll('.payment-option').forEach(el => el.classList.remove('selected'));
      document.querySelector(`input[value="${selected}"]`).closest('.payment-option').classList.add('selected');
      document.getElementById('pse-info').style.display = selected === 'pse' ? 'block' : 'none';
    }

    function renderSummary() {
      const cart = getCart();
      if (cart.length === 0) {
        window.location.href = 'carrito.html';
        return;
      }
      let total = 0;
      const html = cart.map(item => {
        const p = products.find(pr => pr.id === item.id);
        if (!p) return '';
        const sub = p.price * item.qty;
        total += sub;
        return `<div class="summary-item"><span>${p.name} × ${item.qty}</span><span>$${sub.toFixed(2)}</span></div>`;
      }).join('');
      document.getElementById('order-summary').innerHTML = html || '<p>Sin productos</p>';
      document.getElementById('order-total').textContent = `Total: $${total.toFixed(2)}`;
    }

    function placeOrder(e) {
      e.preventDefault();
      const payment = document.querySelector('input[name="payment"]:checked').value;
      clearCart();
      let msg = '¡Pedido realizado con éxito!\\nTe contactaremos pronto.';
      if (payment === 'pse') {
        msg = '¡Pedido registrado!\\nSerás redirigido a PSE para completar el pago de forma segura.\\n(Simulación)';
      }
      alert(msg);
      window.location.href = 'index.html';
    }

    togglePSE();
    renderSummary();
  </script>
</body>
</html>
