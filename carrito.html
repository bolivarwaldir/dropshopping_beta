<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito | Los Chingones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .cart-item { display: flex; gap: 20px; padding: 20px 0; border-bottom: 1px solid #eee; align-items: center; }
    .cart-item img { width: 100px; height: 100px; object-fit: cover; border-radius: 12px; }
    .cart-summary { background: #f9f9f9; padding: 24px; border-radius: 16px; margin-top: 20px; }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo" style="font-weight:800; font-size:1.5rem; color:#111; text-decoration:none;">Los Chingones</a>
      <a href="productos.html">Seguir comprando</a>
    </div>
  </header>
  <section class="section">
    <h2 class="section-title">Tu carrito</h2>
    <div id="cart-items"></div>
    <div id="cart-summary" class="cart-summary" style="display:none;"></div>
    <div style="text-align:center; margin-top:30px;">
      <a href="checkout.html" class="btn" id="checkout-btn" style="display:none;">Ir a pagar</a>
    </div>
  </section>
  <script src="js/data.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth-ui.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-items');
      const summary = document.getElementById('cart-summary');
      const btn = document.getElementById('checkout-btn');
      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#666;">Tu carrito está vacío</p>';
        summary.style.display = 'none';
        btn.style.display = 'none';
        return;
      }
      let total = 0;
      container.innerHTML = cart.map((item, i) => {
        total += item.price * item.qty;
        return `
          <div class="cart-item">
            <img src="${item.image}" alt="">
            <div style="flex:1;">
              <h3>${item.name}</h3>
              <div>$${item.price.toLocaleString()} × ${item.qty}</div>
            </div>
            <button onclick="removeFromCart(${i})" style="background:#fee; color:#c00; border:none; padding:8px 12px; border-radius:8px; cursor:pointer;">Eliminar</button>
          </div>
        `;
      }).join('');
      summary.style.display = 'block';
      summary.innerHTML = `<div style="font-size:1.3rem; font-weight:700;">Total: $${total.toLocaleString()}</div>`;
      btn.style.display = 'inline-block';
    }
    function removeFromCart(index) {
      const cart = getCart();
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
      updateCartCount();
    }
    renderCart();
  </script>
</body>
</html>
