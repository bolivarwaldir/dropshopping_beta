<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Los Chingones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="top-bar">
    <span>🚚 Envíos a nivel nacional</span>
    <span>🔒 Compra 100% segura</span>
    <span>💬 Atención al cliente 24/7</span>
  </div>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo"><img src="imagine_images/2zyoy.jpg" alt="Los Chingones"></a>
      <div class="search-bar">
        <input type="text" id="search" placeholder="Buscar productos...">
      </div>
      <div class="nav-icons">
        <a href="carrito.html">Carrito <span class="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <section class="section">
    <h2 class="section-title">Todos los productos</h2>
    <div class="products-grid" id="products"></div>
  </section>

  <footer>
    <div class="footer-bottom">© 2026 Los Chingones</div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function renderProducts(list) {
      const container = document.getElementById('products');
      container.innerHTML = list.map(p => `
        <a href="producto.html?id=${p.id}" class="product-card">
          <img src="${p.image}" alt="${p.name}">
          <div class="product-info">
            <h3>${p.name}</h3>
            <div class="product-price">$${p.price}</div>
          </div>
        </a>
      `).join('');
    }
    renderProducts(products);

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(q));
      renderProducts(filtered);
    });
  </script>
</body>
</html>
