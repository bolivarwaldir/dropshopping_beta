<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Envíos | Los Chingones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .info-page { max-width: 900px; margin: 40px auto; }
    .info-hero { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); border-radius: 20px; padding: 40px; margin-bottom: 30px; text-align: center; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 30px 0; }
    .info-card { background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    .info-card h3 { margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="../index.html" class="logo" style="font-weight:800; font-size:1.5rem; color:#111; text-decoration:none;">Los Chingones</a>
      <a href="../carrito.html">Carrito <span class="cart-count">0</span></a>
    </div>
  </header>
  <section class="section info-page">
    <div class="info-hero">
      <h1>Política de Envíos</h1>
      <p>Enviamos a todo Colombia de forma rápida y segura.</p>
    </div>
    <div class="info-grid">
      <div class="info-card">
        <h3>🚚 Tiempo de entrega</h3>
        <p>3 a 7 días hábiles según tu ciudad.</p>
      </div>
      <div class="info-card">
        <h3>📦 Seguimiento</h3>
        <p>Recibirás el número de guía por WhatsApp y correo.</p>
      </div>
      <div class="info-card">
        <h3>🎁 Envío gratis</h3>
        <p>En compras superiores a $150.000.</p>
      </div>
    </div>
    <a href="../index.html" class="btn">Volver a la tienda</a>
  </section>
  <script src="../js/cart.js"></script>
</body>
</html>
