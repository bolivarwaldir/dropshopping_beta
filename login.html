<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Los Chingones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-box { max-width: 420px; margin: 60px auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .auth-box h1 { margin-bottom: 24px; font-size: 1.8rem; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; }
    .form-group input { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; }
    .error { color: #dc2626; font-size: 0.9rem; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo" style="font-weight:700; font-size:1.4rem; color:#111; text-decoration:none;">Los Chingones</a>
    </div>
  </header>

  <div class="auth-box">
    <h1>Iniciar sesión</h1>
    <form id="login-form">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn" style="width:100%;">Entrar</button>
      <div class="error" id="error"></div>
    </form>
    <p style="margin-top:20px; text-align:center;">
      ¿No tienes cuenta? <a href="registro.html" style="color:#111; font-weight:600;">Regístrate</a>
    </p>
  </div>

  <script src="js/supabase.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
      } else {
        window.location.href = 'cuenta.html';
      }
    });
  </script>
</body>
</html>
