<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi cuenta | Los Chingones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .account-hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 60px 20px 80px; text-align: center; }
    .account-card { max-width: 500px; margin: -40px auto 40px; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.1); text-align: center; }
    .account-avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 4px solid white; margin-top: -70px; }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo" style="font-weight:800; font-size:1.5rem; color:#111; text-decoration:none;">Los Chingones</a>
      <a href="carrito.html">Carrito <span class="cart-count">0</span></a>
    </div>
  </header>
  <div class="account-hero">
    <h1 style="margin:0;">Mi cuenta</h1>
  </div>
  <div class="account-card" id="account-content">
    <p>Cargando...</p>
  </div>
  <script src="js/supabase.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth-ui.js"></script>
  <script>
    async function loadAccount() {
      const user = await getCurrentUser();
      if (!user) return location.href = 'login.html';
      const avatar = localStorage.getItem('avatar_preview') || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.user_metadata?.full_name || 'U')}&background=111&color=fff&size=200`;
      document.getElementById('account-content').innerHTML = `
        <img class="account-avatar" src="${avatar}" alt="">
        <h2 style="margin:16px 0 4px;">${user.user_metadata?.full_name || 'Usuario'}</h2>
        <p style="color:#666; margin-bottom:20px;">${user.email}</p>
        <p style="margin-bottom:24px;">Desde aquí podrás gestionar tu perfil y ver tus pedidos.</p>
        <a href="editar-perfil.html" class="btn" style="margin-right:8px;">Editar perfil</a>
        <button class="btn" style="background:#dc2626;" onclick="signOut()">Cerrar sesión</button>
      `;
    }
    loadAccount();
  </script>
</body>
</html>
