<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Los Chingones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .admin { max-width: 800px; margin: 40px auto; padding: 24px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo" style="font-weight:800; font-size:1.5rem; color:#111; text-decoration:none; letter-spacing:-0.5px;">Los Chingones</a>
      <span>Panel Administrativo</span>
    </div>
  </header>

  <div class="admin">
    <h2>Gestión de productos</h2>
    <p style="color: var(--muted); margin-bottom: 24px;">Los mensajes del top bar y el banner se pueden editar editando el código o ampliando este panel. (Versión demo con localStorage)</p>
    <table id="products-table">
      <thead><tr><th>Producto</th><th>Precio</th><th>Categoría</th></tr></thead>
      <tbody></tbody>
    </table>
    <p style="margin-top: 30px;"><a href="index.html" class="btn">Volver a la tienda</a></p>
  </div>

  <script src="js/data.js"></script>
  <script>
    const tbody = document.querySelector('#products-table tbody');
    products.forEach(p => {
      tbody.innerHTML += `<tr><td>${p.name}</td><td>$${p.price}</td><td>${p.category}</td></tr>`;
    });
  </script>
</body>
</html>
