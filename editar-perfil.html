<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar perfil | Los Chingones</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .profile-container { max-width: 520px; margin: 50px auto; }
    .profile-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
    .profile-header { height: 140px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); position: relative; }
    .avatar-wrapper { position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%); }
    .avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid white; background: #eee; object-fit: cover; }
    .avatar-edit { position: absolute; bottom: 0; right: 0; background: #111; color: white; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 14px; }
    .profile-body { padding: 70px 30px 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    .form-group input[type="text"] { width: 100%; padding: 14px; border: 1px solid #e5e5e5; border-radius: 12px; font-size: 1rem; }
    .file-input { display: none; }
    .upload-btn { background: #f5f5f5; border: 1px dashed #ccc; padding: 12px; border-radius: 12px; text-align: center; cursor: pointer; font-size: 0.9rem; }
    .upload-btn:hover { background: #eee; }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo" style="font-weight:800; font-size:1.5rem; color:#111; text-decoration:none;">Los Chingones</a>
    </div>
  </header>

  <div class="profile-container">
    <div class="profile-card">
      <div class="profile-header">
        <div class="avatar-wrapper">
          <img id="cover-preview" class="avatar" src="https://ui-avatars.com/api/?name=U&background=111&color=fff&size=200" alt="Avatar">
          <button class="avatar-edit" onclick="document.getElementById('file-input').click()">✏️</button>
        </div>
      </div>
      <div class="profile-body">
        <h2 style="text-align:center; margin-bottom:24px;">Editar perfil</h2>
        <form id="profile-form">
          <div class="form-group">
            <label>Nombre completo</label>
            <input type="text" id="full_name" required>
          </div>
          <div class="form-group">
            <label>Portada del perfil</label>
            <input type="file" id="file-input" class="file-input" accept="image/*">
            <div class="upload-btn" onclick="document.getElementById('file-input').click()">
              📷 Seleccionar imagen desde tu equipo
            </div>
            <small style="color:#666; font-size:0.8rem; display:block; margin-top:6px;">La imagen se guarda en este navegador (para una versión real se usaría Supabase Storage).</small>
          </div>
          <button type="submit" class="btn" style="width:100%; margin-top:10px;">Guardar cambios</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script>
    const fileInput = document.getElementById('file-input');
    const preview = document.getElementById('cover-preview');
    let selectedFile = null;

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (ev) => preview.src = ev.target.result;
        reader.readAsDataURL(file);
      }
    });

    async function load() {
      const user = await getCurrentUser();
      if (!user) return location.href = 'login.html';
      document.getElementById('full_name').value = user.user_metadata?.full_name || '';
      const saved = localStorage.getItem('cover_preview');
      if (saved) preview.src = saved;
      else preview.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.user_metadata?.full_name || 'U')}&background=111&color=fff&size=200`;
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const full_name = document.getElementById('full_name').value;
      if (selectedFile) {
        localStorage.setItem('cover_preview', preview.src);
      }
      const { error } = await supabaseClient.auth.updateUser({ data: { full_name } });
      if (error) alert(error.message);
      else {
        alert('Perfil actualizado');
        location.href = 'cuenta.html';
      }
    });
    load();
  </script>
</body>
</html>
